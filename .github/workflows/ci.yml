name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # On demand. Added after a GitHub Actions outage swallowed the push-
  # triggered runs for a merge to main and there was no way to ask for
  # the verification to happen.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: 'npm'

      - run: npm ci

      # "Don't trust, verify" applied to ourselves: fetch the real sources at
      # their pinned commits (all pins live in packages/quests excerpts.ts),
      # then let the tests diff every excerpt on the site against them, letter
      # for letter — and, for the Lightning specs, run the BOLTs' own test
      # vectors against our TypeScript implementations of them.
      - name: Fetch pinned sources
        run: |
          set -euo pipefail
          PINS="packages/quests/src/lib/excerpts.ts"

          # repo|destination|sparse-checkout dir (empty for a full checkout)
          SOURCES="
          bitcoin/bitcoin|/tmp/bitcoin-pinned|src
          bitcoin/bips|/tmp/bips-pinned|
          lightning/bolts|/tmp/bolts-pinned|
          lightningnetwork/lnd|/tmp/lnd-pinned|
          "

          for entry in $SOURCES; do
            repo="${entry%%|*}"; rest="${entry#*|}"
            dest="${rest%%|*}"; sparse="${rest#*|}"
            commit=$(grep -A3 "'$repo'" "$PINS" | grep -oE "[0-9a-f]{40}" | head -1)
            if [ -z "$commit" ]; then
              echo "::error::no pinned commit found for $repo in $PINS"
              exit 1
            fi
            echo "Pinned $repo: $commit"
            git init --quiet "$dest"
            (
              cd "$dest"
              git remote add origin "https://github.com/$repo.git"
              if [ -n "$sparse" ]; then
                git sparse-checkout set "$sparse"
              fi
              git fetch --quiet --depth=1 --filter=blob:none origin "$commit"
              git checkout --quiet FETCH_HEAD
            )
          done

      - run: npx nx run-many -t lint test build typecheck
        env:
          BITCOIN_SRC: /tmp/bitcoin-pinned
          BIPS_SRC: /tmp/bips-pinned
          BOLTS_SRC: /tmp/bolts-pinned
          LND_SRC: /tmp/lnd-pinned

      - name: Assert Bitcoin artifacts
        run: node tools/assert-site-build.mjs bitcoin /

      # Both front doors are built from this one source tree, so a change
      # that breaks the sibling site must not reach main either.
      - name: Test the Lightning front door
        run: npx nx test web
        env:
          VITE_SITE: lightning

      - name: Build the Lightning front door
        run: npx nx build web
        env:
          VITE_SITE: lightning
          VITE_BASE: /lightning4plebs/

      - name: Assert Lightning artifacts
        run: node tools/assert-site-build.mjs lightning /lightning4plebs/

      # Changing only the base path must also invalidate Nx's build cache.
      - name: Verify alternate base cache input
        run: |
          VITE_SITE=lightning VITE_BASE=/cache-regression/ npx nx build web
          node tools/assert-site-build.mjs lightning /cache-regression/
          VITE_SITE=lightning VITE_BASE=/lightning4plebs/ npx nx build web
          node tools/assert-site-build.mjs lightning /lightning4plebs/

      - name: Verify cached output restoration
        run: |
          saved=$(mktemp -d)
          mv apps/web/dist "$saved/bitcoin"
          mv apps/web/dist-lightning "$saved/lightning"
          VITE_SITE=lightning VITE_BASE=/lightning4plebs/ npx nx build web
          node tools/assert-site-build.mjs lightning /lightning4plebs/
          npx nx build web
          node tools/assert-site-build.mjs bitcoin /

      - name: Verify sibling preservation across cache restores
        run: node tools/assert-cache-isolation.mjs
