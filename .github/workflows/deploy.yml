name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # bitcoin4plebs: this repository's own GitHub Pages site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Project sites are served from /<repo-name>/ — derive it so forks work.
      - run: npx nx build web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # lightning4plebs is published from its own repository, which builds THIS
  # source with VITE_SITE=lightning. GitHub Pages serves one site per repo,
  # so the sibling repo exists purely to host the second front door — and
  # because it pulls a public repo, that deploy needs no credentials at all.
  # This job only proves the Lightning build still works before we ship.
  lightning-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx build web
        env:
          VITE_SITE: lightning
          VITE_BASE: /lightning4plebs/
